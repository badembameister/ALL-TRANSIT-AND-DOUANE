const body={res:tRes,docs:tDocs,transit:tTransit,douane:tDouane,fact:tFact,jr:()=>`<div class="card tbl"><table>${d.journal.map(j=>`<tr><td>${j.t}</td><td>${esc(j.r)}</td><td>${esc(j.m)}</td></tr>`).join('')}</table></div>`}[tab];

function tTransit(d){const t=d.transit,w=can('transit');if(!t)return`<div class="card"><p>Aucune déclaration de transit pour ce dossier.</p>${w?'<button class="pri" onclick="newTransit()">Créer la déclaration de transit</button>':''}</div>`;

${w?`<div class="bar" style="margin-top:12px">${rej?'<button class="pri" onclick="tSet(\'En préparation\')">Reprendre la préparation</button>':`${nx?`<button class="pri" onclick="tSet('${nx}')">Passer à : ${nx}</button>`:''}${t.statut==='En circulation'?'<button class="ghost" onclick="tSet(\'Arrivée à destination\')">Arrivée sans contrôle</button>':''}${t.statut!=='Apurée'?'<button class="ghost" onclick="tInc()">Déclarer un incident</button><button class="dg" onclick="tSet(\'Rejetée\')">Rejeter</button>':''}`}</div>`:''}</div>
<div class="card"><h3>Incidents</h3>${t.incidents.map(x=>`<div class="al">${badge(x.type)} ${x.d} ${esc(x.note)}</div>`).join('')||'<p class="mut">Aucun incident.</p>'}</div>`}
function newTransit(){ask('Déclaration de transit',[{n:'dep',l:'Bureau de départ',r:1},{n:'dest',l:'Bureau de destination',r:1},{n:'vehicule',l:'Véhicule'},{n:'scelle',l:'N° de scellé'},{n:'garantie',l:'Garantie'},{n:'delai',l:'Délai de transit (jours)',t:'number',v:7,r:1}],f=>{const d=cur();d.transit={statut:'En préparation',...f,depart:'',incidents:[]};log(d,'Déclaration de transit créée');render()})}

function tDouane(d){const w=can('douane'),x=d.douane;if(!x)return`<div class="card"><p>Aucune déclaration en douane.</p>${w?'<button class="pri" onclick="dGen()">Générer le projet de déclaration</button>':''}</div>`;
const k=calc(d),ch=checks(d),ok=ch.every(c=>c[1]),s=x.statut,P=S.params,bar=!w?'':s==='Brouillon'?`<button class="pri" ${ok?'':'disabled'} onclick="dMsg('Transmise','Envoi','Déclaration transmise au système douanier')">Transmettre à la douane</button>`:s==='Transmise'?`<span class="mut">Simulation de la réponse :</span><button class="ghost" onclick="dMsg('Acceptée','Réception','Déclaration acceptée')">Acceptée</button><button class="ghost" onclick="dMsg('Contrôle','Réception','Déclaration orientée en contrôle')">Contrôle</button><button class="dg" onclick="dMsg('Rejetée','Réception','Déclaration rejetée : à corriger')">Rejetée</button>`:s==='Acceptée'||s==='Contrôle'?`<button class="pri" onclick="dMsg('Bon à enlever','Réception','Bon à enlever délivré')">Recevoir le bon à enlever</button>`:s==='Rejetée'?`<button class="pri" onclick="dMsg('Brouillon','Interne','Déclaration rouverte pour correction')">Corriger la déclaration</button>`:'';
return`<div class="card"><h3>Déclaration ${esc(x.ref)} ${badge(s)}</h3><div class="tbl"><table><tr><th>Élément</th><th>Base ou taux</th><th>Montant (${B()})</th></tr><tr><td>Valeur CIF (valeur + fret + assurance)</td><td>${money(d.m.valeur,d.m.devise)}</td><td>${fmt(k.cif)}</td></tr><tr><td>Droit de douane</td><td>${k.dd} %${k.known?'':' (taux par défaut)'}</td><td>${fmt(k.droit)}</td></tr>${k.tx.map(x=>`<tr><td>${esc(x.n)}</td><td>${x.t} %</td><td>${fmt(x.m)}</td></tr>`).join('')}${k.ac?`<tr><td>Droit d’accise</td><td>${k.ac} %</td><td>${fmt(k.acm)}</td></tr>`:''}<tr><td>TVA</td><td>${d.type==='Export'?0:P.tva} %</td><td>${fmt(k.tva)}</td></tr><tr><th>Total droits et taxes</th><th></th><th>${fmt(k.tot)}</th></tr></table></div></div>
<div class="card"><h3>Contrôles de cohérence</h3>${ch.map(c=>`<div class="al">${c[1]?badge('Conforme'):badge('Bloquant')} ${c[0]}</div>`).join('')}</div><div class="card"><div class="bar">${bar}</div><h3>Messages douaniers</h3>${x.messages.map(m=>`<div class="al">${badge(m.t)} ${esc(m.x)}</div>`).join('')||'<p class="mut">Aucun message.</p>'}<p class="note">Les réponses douanières sont simulées. La production se branche sur SYDONIA World, le système de la douane guinéenne (mode d’échange à confirmer : API, XML ou fichiers).</p></div>`}

function mkInvoice(){const d=cur(),c=cl(d.clientId),k=calc(d),n=(l,v)=>({n:l,l:{tr:'Honoraires de transit',dd:'Dédouanement',tp:'Transport',ma:'Manutention',mg:'Magasinage',dv:'Frais divers'}[l]+` (${B()})`,t:'number',v:v||0});

const pay=id=>{const f=S.factures.find(x=>x.id===id);ask(`Règlement ${f.num}`,[{n:'m',l:`Montant (${f.devise})`,t:'number',v:Math.round((tot(f)-paid(f))*100)/100,r:1}],r=>{if(+r.m>0){f.paye.push({d:today(),m:+r.m});const d=S.dossiers.find(x=>x.id===f.dossierId);log(d,`Règlement de ${money(+r.m,f.devise)} sur ${f.num}`);render()}})};
const relance=id=>{const f=S.factures.find(x=>x.id===id);f.relances++;log(S.dossiers.find(x=>x.id===f.dossierId),`Relance n°${f.relances} envoyée pour ${f.num}`);render()};
function vFact(){return`<h1>Facturation</h1><div class="bar"><button class="ghost" onclick="csv()">Export comptable (CSV)</button></div><div class="card tbl"><table><tr><th>Facture</th><th>Client</th><th>Total</th><th>Solde</th><th>Échéance</th><th>Statut</th><th></th></tr>${S.factures.map(f=>`<tr><td><button class="lk" onclick="open('${f.dossierId}','fact')">${f.num}</button></td><td>${esc(cl(f.clientId).nom)}</td><td>${money(tot(f),f.devise)}</td><td>${money(tot(f)-paid(f),f.devise)}</td><td>${f.ech}</td><td>${badge(fStat(f))}</td><td>${can('fact')&&fStat(f)!=='Payée'?`<button class="ghost" onclick="pay('${f.id}')">Encaisser</button> <button class="ghost" onclick="relance('${f.id}')">Relancer</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="mut">Aucune facture. Générez-en une depuis un dossier.</td></tr>'}</table></div>`}
const csv=()=>{dlg.innerHTML=`<form method="dialog"><h3>Export comptable (CSV)</h3><textarea readonly rows="9">${esc(['Facture;Date;Client;Devise;Total;Réglé;Statut',...S.factures.map(f=>[f.num,f.date,cl(f.clientId).nom,f.devise,tot(f).toFixed(2),paid(f).toFixed(2),fStat(f)].join(';'))].join('\n'))}</textarea><div class="row"><button class="pri">Fermer</button></div></form>`;dlg.showModal()};
function vClients(){return`<h1>Clients et partenaires</h1>${can('client')?'<div class="bar"><button class="pri" onclick="newClient()">Nouveau client</button></div>':''}<div class="card tbl"><table><tr><th>Code</th><th>Raison sociale</th><th>NIF / RC</th><th>Devise</th><th>Paiement</th><th>Dossiers</th></tr>${S.clients.map(c=>`<tr><td>${c.id}</td><td>${esc(c.nom)}</td><td>${esc(c.nif)}</td><td>${c.devise}</td><td>${c.jours} jours</td><td>${S.dossiers.filter(d=>d.clientId===c.id).length}</td></tr>`).join('')}</table></div>`}
const newClient=()=>ask('Nouveau client',[{n:'nom',l:'Raison sociale',r:1},{n:'nif',l:'NIF / RC',r:1},{n:'devise',l:'Devise',o:Object.keys(S.params.rates)},{n:'jours',l:'Délai de paiement (jours)',t:'number',v:30},{n:'contact',l:'Contact'}],f=>{S.clients.push({id:'C'+String(S.clients.length+1).padStart(3,'0'),...f,jours:+f.jours});render()});
function newDossier(){const P=S.params;ask('Nouveau dossier',[{n:'type',l:'Type d’opération',o:TYPES},{n:'regime',l:'Régime douanier',o:P.reg},{n:'clientId',l:'Client',o:S.clients.map(c=>[c.id,c.nom])},{n:'ref',l:'Référence client'},{n:'fournisseur',l:'Fournisseur / expéditeur'},{n:'dest',l:'Destinataire'},{n:'transporteur',l:'Transporteur'},{n:'des',l:'Désignation des marchandises',r:1},{n:'sh',l:'Code SH',r:1},{n:'colis',l:'Colis',t:'number',r:1},{n:'poids',l:'Poids brut (kg)',t:'number',r:1},{n:'valeur',l:'Valeur',t:'number',r:1},{n:'devise',l:'Devise',o:Object.keys(P.rates)},{n:'origine',l:'Origine'},{n:'fret',l:`Fret (${P.base})`,t:'number',v:0},{n:'assurance',l:`Assurance (${P.base})`,t:'number',v:0}],f=>{const p={Import:'IMP',Export:'EXP','Entrepôt':'ENT','Réexport':'REX'}[f.type]||'TRN';S.seq++;const d={id:'D'+Date.now(),num:`${p}-${new Date().getFullYear()}-${String(S.seq).padStart(4,'0')}`,type:f.type,regime:f.regime,clientId:f.clientId,ref:f.ref,fournisseur:f.fournisseur,dest:f.dest,transporteur:f.transporteur,m:{des:f.des,sh:f.sh.replace(/\D/g,''),colis:+f.colis,poids:+f.poids,valeur:+f.valeur,devise:f.devise,origine:f.origine},fret:+f.fret,assurance:+f.assurance,docs:{},statut:'Ouvert',transit:null,douane:null,factureId:null,journal:[]};log(d,'Dossier créé');S.dossiers.push(d);open(d.id)})}
function vAdmin(){const P=S.params;return`<h1>Administration</h1><div class="card"><h3>Devises et taxes</h3><p>Devise de base : <b>${P.base}</b>. TVA : ${P.tva} %. Droit par défaut : ${P.dd0} %.</p><p class="mut">${Object.entries(P.rates).map(([k,v])=>`1 ${k} = ${v} ${P.base}`).join(', ')}</p><button class="pri" onclick="editP()">Modifier les paramètres</button></div><div class="card tbl"><h3>Taxes à l’importation</h3><table><tr><th>Taxe</th><th>Taux</th><th>Base</th><th>À l’export</th><th></th></tr>${P.taxes.map((x,i)=>`<tr><td>${esc(x.n)}</td><td>${x.t} %</td><td>${x.base==='cif'?'Valeur CIF':'CIF + droits'}</td><td>${x.exp?'Oui':'Non'}</td><td><button class="ghost" onclick="delTax(${i})">Supprimer</button></td></tr>`).join('')}</table><div class="bar" style="margin-top:10px"><button class="ghost" onclick="addTax()">Ajouter une taxe</button></div></div><div class="card"><h3>Régimes douaniers</h3><p>${P.reg.map(esc).join(', ')}</p><button class="ghost" onclick="addReg()">Ajouter un régime</button></div><div class="card tbl"><h3>Tarif des codes SH</h3><table><tr><th>Code SH (début)</th><th>Libellé</th><th>Droit de douane</th><th>Accise</th></tr>${P.sh.map(s=>`<tr><td>${s.c}</td><td>${esc(s.l)}</td><td>${s.dd} %</td><td>${s.ac||0} %</td></tr>`).join('')}</table><div class="bar" style="margin-top:10px"><button class="ghost" onclick="addSH()">Ajouter un code SH</button><button class="dg" onclick="resetAll()">Réinitialiser les données de démonstration</button></div></div><p class="note">Taux et taxes indicatifs (TVA 18 %, droits du tarif extérieur commun CEDEAO). À faire valider auprès de la douane guinéenne avant tout usage réel.</p>`}
const editP=()=>{const P=S.params;ask('Paramètres',[{n:'tva',l:'TVA (%)',t:'number',v:P.tva},{n:'dd0',l:'Droit par défaut (%)',t:'number',v:P.dd0},...Object.keys(P.rates).filter(k=>k!==P.base).map(k=>({n:'r_'+k,l:`1 ${k} en ${P.base}`,t:'number',v:P.rates[k]}))],f=>{P.tva=+f.tva;P.dd0=+f.dd0;Object.keys(f).filter(k=>k.startsWith('r_')).forEach(k=>P.rates[k.slice(2)]=+f[k]);render()})};
const addSH=()=>ask('Nouveau code SH',[{n:'c',l:'Code SH (début)',r:1},{n:'l',l:'Libellé',r:1},{n:'dd',l:'Droit de douane (%)',t:'number',r:1},{n:'ac',l:'Accise (%)',t:'number',v:0}],f=>{S.params.sh.push({c:f.c.replace(/\D/g,''),l:f.l,dd:+f.dd,ac:+f.ac});render()});
const resetAll=()=>{S=seed();sel=null;render()};
const addTax=()=>ask('Nouvelle taxe',[{n:'n',l:'Nom de la taxe',r:1},{n:'t',l:'Taux (%)',t:'number',r:1},{n:'base',l:'Base de calcul',o:[['cif','Valeur CIF'],['cifdd','CIF + droits de douane']]},{n:'exp',l:'S’applique à l’export',o:[['non','Non'],['oui','Oui']]}],f=>{S.params.taxes.push({n:f.n,t:+f.t,base:f.base,exp:f.exp==='oui'});render()});
const delTax=i=>{S.params.taxes.splice(i,1);render()};
const addReg=()=>ask('Nouveau régime',[{n:'n',l:'Nom du régime',r:1}],f=>{S.params.reg.push(f.n);render()});
let ME=null,TK='',USERS=[],CAPI=[];
const getTok=()=>{try{return sessionStorage.getItem('at-tk')||TK}catch(e){return TK}},setTok=t=>{TK=t||'';try{t?sessionStorage.setItem('at-tk',t):sessionStorage.removeItem('at-tk')}catch(e){}};
async function api(path,o={}){const h={};const t=getTok();if(t)h.Authorization='Bearer '+t;if(o.json){h['Content-Type']='application/json';o={...o,body:JSON.stringify(o.json)}}
const r=await fetch('/api'+path,{method:o.method||'GET',headers:h,body:o.body});if(r.status===401){logout();throw new Error('Session expirée, reconnectez-vous')}
const d=await r.json().catch(()=>null);if(!r.ok){const x=d&&d.detail;throw new Error(typeof x==='string'?x:Array.isArray(x)?x.map(i=>(i.msg||'').replace('Value error, ','')).join(' ; '):x&&x.message||'Erreur '+r.status)}return d}
function logout(){setTok('');ME=null;sel=null;document.body.classList.add('locked')}
function start(){document.body.classList.remove('locked');view='dashboard';sel=null;S=load();render()}
async function doLogin(e){e.preventDefault();const f=new FormData(e.target),b=$('#lf button');b.disabled=true;$('#lerr').textContent='';
try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({username:f.get('u'),password:f.get('p')})});const d=await r.json().catch(()=>({}));
if(!r.ok)throw new Error(r.status===401?'Identifiants incorrects':typeof d.detail==='string'?d.detail:'Service indisponible ('+r.status+')');setTok(d.access_token);ME=await api('/auth/me');role=ME.role;e.target.reset();start()}catch(x){$('#lerr').textContent=x.message}b.disabled=false;return false}
const info=(t,h)=>{dlg.innerHTML=`<form method="dialog"><h3>${t}</h3><div style="grid-column:1/-1">${h}</div><div class="row"><button class="pri">Fermer</button></div></form>`;dlg.showModal()};
const genPwd=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';return Array.from(crypto.getRandomValues(new Uint32Array(14)),x=>a[x%a.length]).join('')+'a7'};
const vUsers=()=>`<h1>Utilisateurs</h1><div class="bar"><button class="pri" onclick="newUser()">Nouvel utilisateur</button></div><div id="ul"><p class="mut">Chargement…</p></div>`;
async function loadUsers(){try{[USERS,CAPI]=await Promise.all([api('/users'),api('/clients')])}catch(e){$('#ul').innerHTML=`<p class="note">${esc(e.message)}</p>`;return}
$('#ul').innerHTML=`<div class="card tbl"><table><tr><th>Nom</th><th>E-mail</th><th>Rôle</th><th>Statut</th><th></th></tr>${USERS.map(u=>`<tr><td>${esc(u.nom)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td><span class="b ${u.actif?'ok':'ba'}">${u.actif?'Actif':'Désactivé'}</span></td><td><button class="ghost" onclick="editUser(${u.id})">Modifier</button> <button class="ghost" onclick="resetPwd(${u.id})">Mot de passe</button></td></tr>`).join('')}</table></div>`}
const cliOpts=()=>[['','Aucun'],...CAPI.map(c=>[String(c.id),c.nom])];
const newUser=()=>ask('Nouvel utilisateur',[{n:'nom',l:'Nom complet',r:1},{n:'email',l:'Adresse e-mail',t:'email',r:1},{n:'role',l:'Rôle',o:ROLES,v:'Agent opérationnel'},{n:'client_id',l:'Client rattaché (rôle Client)',o:cliOpts()},{n:'password',l:'Mot de passe initial',v:genPwd(),r:1}],async f=>{
try{await api('/users',{method:'POST',json:{nom:f.nom,email:f.email,role:f.role,password:f.password,client_id:f.client_id?+f.client_id:null}});info('Compte créé',`<p>Identifiant : <b>${esc(f.email.trim().toLowerCase())}</b></p><p>Mot de passe initial : <code>${esc(f.password)}</code></p><p class="mut">Transmettez-le par un canal sûr. L’utilisateur pourra le changer avec « Mon mot de passe ».</p>`);loadUsers()}catch(e){info('Création impossible',`<p>${esc(e.message)}</p>`)}});
const editUser=id=>{const u=USERS.find(x=>x.id===id);ask('Modifier l’utilisateur',[{n:'nom',l:'Nom complet',v:u.nom,r:1},{n:'role',l:'Rôle',o:ROLES,v:u.role},{n:'client_id',l:'Client rattaché (rôle Client)',o:cliOpts(),v:String(u.client_id||'')},{n:'actif',l:'Statut',o:[['true','Actif'],['false','Désactivé']],v:String(u.actif)}],async f=>{
try{await api('/users/'+id,{method:'PATCH',json:{nom:f.nom,role:f.role,actif:f.actif==='true',client_id:f.client_id?+f.client_id:null}});loadUsers()}catch(e){info('Modification impossible',`<p>${esc(e.message)}</p>`)}})};
const resetPwd=id=>{const u=USERS.find(x=>x.id===id);ask('Réinitialiser le mot de passe',[{n:'password',l:'Nouveau mot de passe pour '+u.email,v:genPwd(),r:1}],async f=>{
try{await api(`/users/${id}/password`,{method:'POST',json:{password:f.password}});info('Mot de passe réinitialisé',`<p>Nouveau mot de passe : <code>${esc(f.password)}</code></p><p class="mut">Transmettez-le par un canal sûr.</p>`)}catch(e){info('Échec',`<p>${esc(e.message)}</p>`)}})};
const myPwd=()=>ask('Mon mot de passe',[{n:'ancien',l:'Mot de passe actuel',t:'password',r:1},{n:'nouveau',l:'Nouveau mot de passe (10 caractères minimum)',t:'password',r:1}],async f=>{
try{await api('/auth/change-password',{method:'POST',json:f});info('Mot de passe modifié','<p>Votre mot de passe a été changé.</p>')}catch(e){info('Échec',`<p>${esc(e.message)}</p>`)}});
(async()=>{document.body.classList.add('locked');if(getTok()){try{ME=await api('/auth/me');role=ME.role;start()}catch(e){}}})();
</script><script src="/ops.js"></script><script src="/transit.js"></script><script src="/dossiers.js"></script></body></html>
